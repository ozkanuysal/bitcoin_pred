name: Fetch Bitcoin Data

on:
  push:
    branches:
      - main 
  schedule:
    - cron: '0 0 * * *' # Her gün saat 00:00'da çalıştır
  workflow_dispatch:

# Workflow için gereken izinleri ekleyin
permissions:
  contents: write

jobs:
  fetch_data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 0  # Tüm geçmişi çek
      
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'
      
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas
      
    - name: Calculate next day number
      id: calculate-days
      run: |
        # metadata.json dosyasını kontrol et
        if [ -f "data/metadata.json" ]; then
          # Son kullanılan gün sayısını ve tarihini al
          LAST_DAYS=$(grep -oP '"days":\s*\K\d+' data/metadata.json)
          LAST_UPDATE=$(grep -oP '"last_update":\s*"\K[^"]+' data/metadata.json)
          LAST_UPDATE_DATE=$(echo $LAST_UPDATE | cut -d'T' -f1)
          TODAY=$(date -u +%Y-%m-%d)
          
          echo "Last update: $LAST_UPDATE_DATE"
          echo "Today: $TODAY"
          
          # Bugün zaten çalıştırıldı mı kontrol et
          if [ "$LAST_UPDATE_DATE" == "$TODAY" ]; then
            echo "⚠️  Data already fetched today ($TODAY). Skipping..."
            echo "SKIP=true" >> $GITHUB_OUTPUT
            echo "DAYS=$LAST_DAYS" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Bir sonraki gün sayısını hesapla
          NEXT_DAY=$((LAST_DAYS + 1))
          echo "Found last day: $LAST_DAYS, next day will be: $NEXT_DAY"
        else
          # İlk çalıştırma, 1'den başla
          NEXT_DAY=1
          echo "No metadata.json found. Starting from day 1"
        fi
        
        echo "SKIP=false" >> $GITHUB_OUTPUT
        echo "DAYS=$NEXT_DAY" >> $GITHUB_OUTPUT
        echo "Fetching data for day $NEXT_DAY"
      
    - name: Fetch Bitcoin data
      if: steps.calculate-days.outputs.SKIP != 'true'
      run: |
        python src/fetch_data_script.py ${{ steps.calculate-days.outputs.DAYS }}

    - name: Clean old CSV files (keep last 10)
      if: steps.calculate-days.outputs.SKIP != 'true'
      run: |
        echo "Cleaning old CSV files..."
        if [ -d "data" ] && [ "$(ls -A data/BTC_USD_*days.csv 2>/dev/null)" ]; then
          cd data
          # Dosyaları gün sayısına göre sırala ve ilk 10'u tut, geri kalanını sil
          file_count=$(ls BTC_USD_*days.csv 2>/dev/null | wc -l)
          if [ "$file_count" -gt 10 ]; then
            ls BTC_USD_*days.csv | sort -V | head -n $((file_count - 10)) | xargs rm -f
            echo "Deleted old files. Remaining files:"
          else
            echo "File count ($file_count) is 10 or less. No deletion needed. Current files:"
          fi
          ls -1 BTC_USD_*days.csv 2>/dev/null | sort -V
          cd ..
        else
          echo "No files to clean"
        fi

    - name: Set up Git
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
      
    - name: Commit and push changes
      if: steps.calculate-days.outputs.SKIP != 'true'
      run: |
        git add data/
        
        # Eğer değişiklik varsa commit at
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto fetch BTC data for day ${{ steps.calculate-days.outputs.DAYS }}"
          git push
        fi