name: Fetch Bitcoin Data

on:
  push:
    branches:
      - main 
  schedule:
    - cron: '0 0 * * *' # Her gün saat 00:00'da çalıştır ()
  workflow_dispatch:

# Workflow için gereken izinleri ekleyin
permissions:
  contents: write

jobs:
  fetch_data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 0  # Tüm geçmişi çek
      
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'
      
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas
      
    - name: Calculate days based on existing files
      id: calculate-days
      run: |
        # Metadata dosyasını kontrol et
        if [ -f "data/metadata.json" ]; then
          # Son kullanılan gün sayısını al
          LAST_DAYS=$(grep -o '"days": [0-9]*' data/metadata.json | awk '{print $2}')
          # Bir sonraki gün sayısını hesapla
          DAYS=$((LAST_DAYS + 1))
        else
          # İlk çalıştırma, varsayılan gün sayısını kullan
          DAYS=30
        fi
        
        # Fazla büyümeyi önlemek için üst sınır (isteğe bağlı)
        if [ $DAYS -gt 365 ]; then
          DAYS=30
        fi
        
        echo "DAYS=$DAYS" >> $GITHUB_OUTPUT
        echo "Fetching data for last $DAYS days"
      
    - name: Fetch Bitcoin data
      run: |
        python src/fetch_data_script.py ${{ steps.calculate-days.outputs.DAYS }}

    - name: Clean old CSV (keep last 10 files)
      run: |
      
        echo "Cleaning old CSV files..."
        cd data
        ls -t BTC_USD_*.csv | tail -n +11 | xargs rm -f
        echo "Old CSV files cleaned. Remaining files:"
        ls -lt BTC_USD_*.csv | head -n 10
        cd ..

    - name: Set up Git
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
      
    - name: Commit and push changes
      run: |
        git add data/
        
        # Eğer değişiklik varsa commit at
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto fetch BTC data for last ${{ steps.calculate-days.outputs.DAYS }} days"
          git push
        fi