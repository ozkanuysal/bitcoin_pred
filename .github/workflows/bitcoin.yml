name: Fetch Bitcoin Data

on:
  push:
    branches:
      - main 
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  fetch_data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 0  # Tüm geçmişi çek
      
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'
      
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas
      
    - name: Determine days parameter
      id: get-days
      run: |
        # Zamanı kontrol et ve kaç günlük veri çekileceğini belirle
        MINUTES=$(date +%M)
        CYCLE=$(( (MINUTES / 5) % 3 ))
        
        if [ $CYCLE -eq 0 ]; then
          DAYS=30
        elif [ $CYCLE -eq 1 ]; then
          DAYS=31
        else
          DAYS=32
        fi
        
        echo "DAYS=$DAYS" >> $GITHUB_OUTPUT
        echo "Fetching data for last $DAYS days"
      
    - name: Fetch Bitcoin data
      run: |
        python src/fetch_data_script.py ${{ steps.get-days.outputs.DAYS }}
      
    - name: Set up Git
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
      
    - name: Commit and push changes
      run: |
        git add data/
        
        # Eğer değişiklik varsa commit at
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto fetch BTC data for last ${{ steps.get-days.outputs.DAYS }} days"
          git push
        fi