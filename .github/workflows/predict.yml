name: Bitcoin Quick Prediction
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  quick_predict:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install compatible NumPy version first (Prophet 1.1.5 needs NumPy < 2.0)
        pip install "numpy<2.0"
        pip install pandas statsmodels
        # Install cmdstanpy first, then Prophet with compatible versions
        pip install cmdstanpy==1.2.0
        pip install prophet==1.1.5 --no-deps
        pip install pystan holidays python-dateutil tqdm importlib-resources
        sudo apt-get update
        sudo apt-get install -y jq
    - name: Install CmdStan
      run: |
        python -c "import cmdstanpy; cmdstanpy.install_cmdstan()"
    - name: Find latest CSV file
      id: find_csv
      run: |
        latest_csv=$(ls -t data/BTC_USD_*.csv | head -n 1)
        echo "LATEST_CSV=$latest_csv" >> $GITHUB_ENV
        echo "Found latest CSV: $latest_csv"
    - name: Run multi-window prediction
      run: |
        mkdir -p prediction

        # Yarın için tarih oluştur
        predict_date=$(date -d "tomorrow" +%Y-%m-%d)
        predict_date_fmt=$(echo $predict_date | tr '-' '_')
        json_file="prediction/${predict_date_fmt}_predictions.json"

        echo "Prediction date: $predict_date"
        echo "Output file: $json_file"

        # Python script'i JSON modunda çalıştır
        python src/quick_predict.py $LATEST_CSV --json > prediction/tmp_output.json

        # Debug: Çıktıyı görüntüle
        echo "=== Raw JSON Output ==="
        cat prediction/tmp_output.json
        echo "======================="

        # jq ile prediction_date ve created_at ekle
        jq --arg pd "$predict_date" \
           --arg ca "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
           '{prediction_date: $pd, created_at: $ca} + .' \
           prediction/tmp_output.json > "$json_file"

        # Geçici dosyayı sil
        rm -f prediction/tmp_output.json

        # Final JSON'ı göster
        echo "=== Final Prediction JSON ==="
        cat "$json_file"
        echo "============================="

    - name: Verify prediction file exists
      run: |
        if [ -z "$(ls -A prediction/*.json 2>/dev/null)" ]; then
          echo "ERROR: No prediction JSON files found!"
          exit 1
        fi
        echo "Prediction files found:"
        ls -lh prediction/*.json

    - name: Commit and push predictions
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add prediction/*.json
        if git diff --staged --quiet; then
          echo "No prediction changes to commit"
        else
          prediction_file=$(ls -t prediction/*.json | head -n 1)
          git commit -m "Auto prediction for $(basename $prediction_file .json)"
          git pull --rebase origin main
          git push
        fi
