name: Bitcoin Quick Prediction
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  quick_predict:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install compatible NumPy version first (Prophet 1.1.5 needs NumPy < 2.0)
        pip install "numpy<2.0"
        pip install pandas statsmodels
        # Install cmdstanpy first, then Prophet with compatible versions
        pip install cmdstanpy==1.2.0
        pip install prophet==1.1.5 --no-deps
        pip install pystan holidays python-dateutil tqdm importlib-resources
        sudo apt-get update
        sudo apt-get install -y jq
    - name: Install CmdStan
      run: |
        python -c "import cmdstanpy; cmdstanpy.install_cmdstan()"
    - name: Find latest CSV file
      id: find_csv
      run: |
        latest_csv=$(ls -t data/BTC_USD_*.csv | head -n 1)
        echo "LATEST_CSV=$latest_csv" >> $GITHUB_ENV
    - name: Run quick prediction and save results
      run: |
        mkdir -p prediction
        
        # Python script çalıştır ve çıktıyı kaydet
        python src/quick_predict.py $LATEST_CSV > prediction/tmp_prediction.txt
        
        # Debug: Çıktıyı görüntüle
        echo "=== Prediction Output ==="
        cat prediction/tmp_prediction.txt
        echo "========================"
        
        # Tahmin satırlarını al
        prophet_line=$(grep "Prophet ile" prediction/tmp_prediction.txt | tail -1)
        arima_line=$(grep "ARIMA ile" prediction/tmp_prediction.txt | tail -1)
        
        # Eğer tahmin satırları yoksa hata ver
        if [ -z "$prophet_line" ] || [ -z "$arima_line" ]; then
          echo "ERROR: Prediction lines not found!"
          echo "Prophet line: $prophet_line"
          echo "ARIMA line: $arima_line"
          exit 1
        fi
        
        # Yarın için tarih oluştur (tahmin her zaman bir sonraki gün için)
        predict_date=$(date -d "tomorrow" +%Y-%m-%d)
        predict_date_fmt=$(echo $predict_date | tr '-' '_')
        
        echo "Prediction date: $predict_date"
        echo "File name: ${predict_date_fmt}_predictions.json"
        
        json_file="prediction/${predict_date_fmt}_predictions.json"
        
        # Prophet ve ARIMA değerlerini al - DÜZELTME BURADA
        # Örnek satır: "Prophet ile 2025-10-24 için tahmin: 34.56 USD"
        # Sadece sayıyı almak için "USD" kelimesinden önceki değeri al
        prophet_value=$(echo $prophet_line | grep -oP '\d+\.\d+(?= USD)')
        arima_value=$(echo $arima_line | grep -oP '\d+\.\d+(?= USD)')
        
        echo "Prophet value extracted: $prophet_value"
        echo "ARIMA value extracted: $arima_value"
        
        # Eğer değerler boşsa hata ver
        if [ -z "$prophet_value" ] || [ -z "$arima_value" ]; then
          echo "ERROR: Could not extract prediction values!"
          echo "Prophet value: $prophet_value"
          echo "ARIMA value: $arima_value"
          exit 1
        fi
        
        # JSON dosyası oluştur
        jq -n \
          --arg prophet_date "$predict_date" \
          --argjson prophet_value "$prophet_value" \
          --arg arima_date "$predict_date" \
          --argjson arima_value "$arima_value" \
          --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          '{
            "prediction_date": $prophet_date,
            "created_at": $created_at,
            "prophet": {
              "date": $prophet_date, 
              "prediction": $prophet_value
            },
            "arima": {
              "date": $arima_date, 
              "prediction": $arima_value
            }
          }' > $json_file
        
        # Dosyanın oluşturulduğunu doğrula
        if [ -f "$json_file" ]; then
          echo "SUCCESS: Prediction file created: $json_file"
          cat $json_file
        else
          echo "ERROR: Failed to create prediction file!"
          exit 1
        fi
        
    - name: Verify prediction file exists
      run: |
        if [ -z "$(ls -A prediction/*.json 2>/dev/null)" ]; then
          echo "ERROR: No prediction JSON files found!"
          exit 1
        fi
        echo "Prediction files found:"
        ls -lh prediction/*.json
        
    - name: Commit and push predictions
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add prediction/*.json
        if git diff --staged --quiet; then
          echo "No prediction changes to commit"
        else
          prediction_file=$(ls -t prediction/*.json | head -n 1)
          git commit -m "Auto prediction for $(basename $prediction_file .json)"
          git pull --rebase origin main
          git push
        fi